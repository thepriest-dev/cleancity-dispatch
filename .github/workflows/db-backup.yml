name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backup repo
        uses: actions/checkout@v4
        with:
          repository: thepriest-dev/cleancity-db-backups
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: backup-repo

      - name: Remove old PostgreSQL and install PostgreSQL 17
        run: |
          # Step 1: Completely remove any existing postgresql client
          sudo apt-get remove -y --purge 'postgresql-client*' || true
          sudo apt-get autoremove -y || true

          # Step 2: Add PostgreSQL 17 repository
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq

          # Step 3: Install ONLY PostgreSQL 17 client
          sudo apt-get install -y postgresql-client-17

          # Step 4: Verify — this must show 17.x, not 16.x
          echo "=== pg_dump version check ==="
          /usr/lib/postgresql/17/bin/pg_dump --version
          echo "=============================="

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Testing DATABASE_URL (password masked):"
          echo "$DATABASE_URL" | sed 's/:[^:@]*@/:***@/'

          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          FILENAME="backup-repo/db-backup-${TIMESTAMP}.sql"
          PG_DUMP="/usr/lib/postgresql/17/bin/pg_dump"

          if [ ! -x "$PG_DUMP" ]; then
            echo "FATAL: $PG_DUMP not found or not executable"
            ls -la /usr/lib/postgresql/ || true
            exit 1
          fi

          echo "Using: $($PG_DUMP --version)"
          echo "Starting pg_dump..."

          if ! "$PG_DUMP" "$DATABASE_URL" \
              --no-owner \
              --no-privileges \
              --schema=public \
              --schema=auth \
              --verbose \
              > "$FILENAME" 2> /tmp/pg_dump_error.log; then
            echo "FAILED: pg_dump error"
            echo "=========== FULL ERROR ==========="
            cat /tmp/pg_dump_error.log
            echo "=================================="
            exit 1
          fi

          if [ ! -s "$FILENAME" ]; then
            echo "FATAL: backup file is empty"
            exit 1
          fi

          gzip "$FILENAME"
          echo "SUCCESS: pg_dump completed"
          echo "Backup: ${FILENAME}.gz"
          echo "Size: $(du -h ${FILENAME}.gz | cut -f1)"

      - name: Commit and push to backup repo
        working-directory: backup-repo
        run: |
          git config user.name "CleanCity Backup Bot"
          git config user.email "backup-bot@cleancity.local"
          git add .
          git commit -m "Automated backup $(date +%Y-%m-%d_%H-%M-%S)" || echo "No changes"
          git push

      - name: Prune backups older than 30 days
        working-directory: backup-repo
        run: |
          find . -name "db-backup-*.sql.gz" -mtime +30 -delete
          git add .
          git diff --staged --quiet || git commit -m "Prune old backups"
          git diff --staged --quiet || git push
